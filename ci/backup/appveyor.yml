# Configuration rescued from 'old-master' branch.
# Only one Visual Studio (latest one), and all possible configurations
image: Visual Studio 2019

configuration:
  - Debug
  - Release

platform:
  - x86
  - x64

environment:
  VCVARS: C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Auxiliary\Build\vcvarsall.bat

  PYTHON: "C:\\Python39-x64"
    
  matrix:
      - SHARED: ON
      - SHARED: OFF

shallow_clone: true

install:
    - set PATH=%PATH%;%PYTHON%/Scripts/
    - echo %APPVEYOR_BUILD_FOLDER%
    - if not exist deps mkdir deps
    - cd deps
    - if not exist ninja appveyor DownloadFile https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -FileName ninja.zip
    - if not exist ninja 7z x ninja.zip -o%APPVEYOR_BUILD_FOLDER%\deps\ninja > nul
    - set PATH=%APPVEYOR_BUILD_FOLDER%\deps\ninja;%PATH%
    - ninja --version
    - python -m pip install --upgrade pip
    - pip3.exe install 'conan>=2,<3'
    - pip3.exe install lxml
    - cd %APPVEYOR_BUILD_FOLDER%

before_build:
    - cmd: conan remote list
    - cmd: if not exist c:\Users\appveyor\.conan2 mkdir c:\Users\appveyor\.conan2
    - cmd: conan profile detect --name default --force
    - cmd: if "%platform%"=="x64" (set ARCHITECTURE=x86_64) else (set ARCHITECTURE=x86)
    - cmd: if "%CONFIGURATION%"=="Debug" (set RUNTIME_TYPE=Debug) else (set RUNTIME_TYPE=Release)
    - cmd: powershell -NoProfile -Command "$profile = Join-Path $env:USERPROFILE '.conan2\profiles\default'; $content = Get-Content $profile; $content = $content -replace '^arch=.*', \"arch=$env:ARCHITECTURE\"; $content = $content -replace '^build_type=.*', \"build_type=$env:CONFIGURATION\"; $content = $content -replace '^compiler=.*', 'compiler=msvc'; $content = $content -replace '^compiler.version=.*', 'compiler.version=192'; $content = $content -replace '^compiler.runtime=.*', 'compiler.runtime=dynamic'; if ($content | Select-String '^compiler.runtime_type=') { $content = $content -replace '^compiler.runtime_type=.*', \"compiler.runtime_type=$env:RUNTIME_TYPE\" } else { $content += \"compiler.runtime_type=$env:RUNTIME_TYPE\" }; Set-Content -Path $profile -Value $content"
    - cmd: powershell -NoProfile -Command "$path = 'c:\\Users\\appveyor\\.conan2\\global.conf'; if (-not (Test-Path $path)) { New-Item -ItemType File -Path $path -Force | Out-Null }; $value = 'core.cache:storage_path=c:\\Users\\appveyor\\conanCache'; if (-not ((Get-Content $path -ErrorAction SilentlyContinue) -contains $value)) { Add-Content -Path $path -Value $value }"
    - cmd: cat c:\Users\appveyor\.conan2\global.conf
    - cmd: cat c:\Users\appveyor\.conan2\profiles\default

build_script:
    - cmd: md build
    - cmd: cd build
    - cmd: if "%platform%"=="x64" (set VC_ARCH=x86_amd64) else (set VC_ARCH=x86)
    - cmd: call "%VCVARS%" %VC_ARCH%
    - cmd: conan install .. --build missing -o webready=True
    - cmd: cmake -GNinja -DBUILD_SHARED_LIBS=%SHARED% -DEXIV2_TEAM_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=%CONFIGURATION% -DEXIV2_ENABLE_NLS=OFF -DEXIV2_ENABLE_PNG=ON -DEXIV2_ENABLE_WEBREADY=ON -DEXIV2_ENABLE_CURL=ON -DEXIV2_BUILD_UNIT_TESTS=ON -DEXIV2_ENABLE_WIN_UNICODE=OFF -DEXIV2_ENABLE_BMFF=ON -DCMAKE_INSTALL_PREFIX=install ..
    - cmd: ninja
    - cmd: ninja install
    - cmd: cd bin
    - cmd: unit_tests.exe
    - cmd: cd ../../tests/
    - cmd: set EXIV2_EXT=.exe
    - cmd: c:\Python39-x64\python.exe runner.py -v

cache:
- deps                          # Ninja installation
  #- c:\Users\appveyor\conanCache  # Conan cache
