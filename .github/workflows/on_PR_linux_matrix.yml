name: On PRs - Linux-Ubuntu Matrix

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "*.md"

jobs:
  Linux:
    name: 'Ubuntu - GCC, BuildType:${{matrix.build_type}}, SHARED:${{matrix.shared_libraries}}'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        shared_libraries: [ON, OFF]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo eatmydata apt-get update
          sudo eatmydata apt-get -y install libbrotli-dev libcurl4-openssl-dev libinih-dev libgmock-dev python3-lxml

      - name: Build
        run: |
          cmake --preset base_linux -S . -B build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DBUILD_SHARED_LIBS=${{matrix.shared_libraries}}
          cmake --build build --parallel

      - name: Install
        run: |
          cmake --install build

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  Alpine:
    name: 'Alpine Edge - GCC, BuildType:${{matrix.build_type}}, SHARED:${{matrix.shared_libraries}} ARCH:${{matrix.arch}}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: ['loongarch64', 'riscv64', 's390x']
        build_type: [Release, Debug]
        shared_libraries: [ON, OFF]

    defaults:
      run:
        shell: alpine.sh {0}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jirutka/setup-alpine@v1
        with:
          arch: ${{matrix.arch}}
          branch: edge
          packages: >
            build-base cmake samurai brotli-dev curl-dev expat-dev inih-inireader-dev gtest-dev python3-dev zlib-dev
      - name: Build
        run: |
          cmake --preset base_linux -S . -B build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DBUILD_SHARED_LIBS=${{matrix.shared_libraries}}
          cmake --build build --parallel
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
