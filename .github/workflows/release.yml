name: Release
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  Linux:
    name: 'Build Linux Release'
    runs-on: ${{ matrix.runner.os }}
    strategy:
      matrix:
        runner:
          - { os: ubuntu-22.04, arch: x64   }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    permissions:
      id-token: write  # For sigstore
      attestations: write  # For artifact attestation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt install -y gettext doxygen graphviz ninja-build
          python -m pip install 'conan>=2,<3'

      - name: Conan common config
        run: |
          conan profile detect --name default --force
          sed -i "s/^build_type=.*/build_type=Release/" ~/.conan2/profiles/default
          sed -i 's/^compiler.libcxx=.*/compiler.libcxx=libstdc++11/' ~/.conan2/profiles/default

      - name: Run Conan
        run: |
          mkdir build && cd build
          conan profile list
          conan install .. -o webready=False --build missing

      - name: Build packaged release
        run: |
          cmake --preset linux-all -S . -B build -DEXIV2_TEAM_PACKAGING=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DEXIV2_ENABLE_WEBREADY=OFF -DEXIV2_ENABLE_CURL=OFF -DEXIV2_BUILD_SAMPLES=OFF -DCONAN_AUTO_INSTALL=OFF
          cmake --build build -t doc
          cmake --build build -t package

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./build/exiv2-*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: exiv2-${{ matrix.runner.arch }}-${{ matrix.runner.os }}
          path: ./build/exiv2-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  macOS:
    name: 'Build macOS Release'
    runs-on: ${{ matrix.runner.os }}
    strategy:
      matrix:
        runner:
          - { os: macos-15-intel, arch: x64   }
          - { os: macos-14,       arch: arm64 }
    permissions:
      id-token: write  # For sigstore
      attestations: write  # For artifact attestation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew install inih tree doxygen graphviz

      - name: Build packaged release
        run: |
          cmake -GNinja -S . -B build \
            -DEXIV2_TEAM_PACKAGING=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DEXIV2_ENABLE_WEBREADY=OFF \
            -DEXIV2_ENABLE_NLS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXIV2_TEAM_WARNINGS_AS_ERRORS=ON \
            -DEXIV2_BUILD_DOC=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          cmake --build build -t doc
          cmake --build build -t package

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./build/exiv2-*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: exiv2-${{ matrix.runner.arch }}-${{ matrix.runner.os }}
          path: ./build/exiv2-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  Windows:
    name: 'Build Windows Release'
    runs-on: ${{ matrix.runner.os }}
    strategy:
      matrix:
        runner:
          - { os: windows-2022, arch: x64   }
    permissions:
      id-token: write  # For sigstore
      attestations: write  # For artifact attestation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install doxygen
        run: |
          choco install doxygen.install
          choco install graphviz

      - name: Restore conan cache
        uses: actions/cache@v6
        with:
            path: ${{github.workspace}}/conanCache
            key: ${{runner.os}}-release-win-${{ hashFiles('conanfile.py') }}
            lookup-only: true

      - name: Install Conan & Common config
        run: |
          python -m pip install 'conan>=2,<3'
          conan profile detect --name default --force
          $profile = Join-Path $HOME '.conan2/profiles/default'
          $content = Get-Content $profile
          $content = $content -replace '^build_type=.*', 'build_type=Release'
          $content = $content -replace '^compiler=.*', 'compiler=msvc'
          Set-Content -Path $profile -Value $content
          $globalConfig = Join-Path $HOME '.conan2/global.conf'
          if (-not (Test-Path $globalConfig)) { New-Item -ItemType File -Path $globalConfig -Force | Out-Null }
          $value = "core.cache:storage_path=$Env:GITHUB_WORKSPACE/conanCache"
          if (-not ((Get-Content $globalConfig -ErrorAction SilentlyContinue) -contains $value)) { Add-Content -Path $globalConfig -Value $value }

      - name: Run Conan
        run: |
          md build
          cd build
          conan install .. --build missing

      - name: Build packaged release
        run: |
          cmake --preset win-release -S . -B build -DEXIV2_TEAM_PACKAGING=ON -DEXIV2_BUILD_DOC=ON -DEXIV2_ENABLE_WEBREADY=OFF -DEXIV2_ENABLE_CURL=OFF -DEXIV2_BUILD_SAMPLES=OFF -DCONAN_AUTO_INSTALL=OFF
          cmake --build build --parallel -t doc
          cmake --build build --parallel -t package

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./build/exiv2-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: exiv2-${{ matrix.runner.arch }}-${{ matrix.runner.os }}
          path: ./build/exiv2-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [Linux, macOS, Windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: github.event_name == 'push'  # only publish when a new version tag is pushed
    steps:
      - uses: actions/download-artifact@v8
      - name: List downloaded files
        run: tree -L 3
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: gh release create "$RELEASE_NAME" ./exiv2-*/exiv2-* --repo "$GITHUB_REPO" --generate-notes
