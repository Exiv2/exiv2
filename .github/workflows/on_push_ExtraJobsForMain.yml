name: On PUSH - Linux Special Builds for main branch

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:

jobs:
  special_debugRelease:
    name: 'Ubuntu - GCC - Debug+Coverage'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo eatmydata apt-get update
          sudo eatmydata apt-get -y install libbrotli-dev libcurl4-openssl-dev libinih-dev libgmock-dev python3-lxml gcovr

      - name: Build
        run: |
          cmake --preset linux-coverage -S . -B build
          cmake --build build

      - name: Tests + Upload coverage
        run: |
          ctest --test-dir build --output-on-failure
          # this needs to match the ecommand in on_PR_linux_secial_builds.yml!
          gcovr --root . --object-dir build --exclude-unreachable-branches --exclude-throw-branches --xml -o build/coverage.xml build
          curl https://keybase.io/codecovsecops/pgp_keys.asc | gpg --import
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          curl -Os https://uploader.codecov.io/latest/linux/codecov.SHA256SUM
          curl -Os https://uploader.codecov.io/latest/linux/codecov.SHA256SUM.sig
          gpg --verify codecov.SHA256SUM.sig codecov.SHA256SUM
          shasum -a 256 -c codecov.SHA256SUM
          chmod +x codecov
          ./codecov -f build/coverage.xml
