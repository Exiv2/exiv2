# Basic CI for all platforms on push
# Note that we want to run this as fast as possible and just for the more common configurations. On
# PRs, we will test things more intensively :)
# - Only running UnitTests and not regression tests

name: On PUSH - Basic CI for main platforms

on:
  push:
    paths-ignore:
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Linux:
    name: 'Ubuntu 24.04 - GCC - Arch:${{ matrix.runner.arch }} BuildType:Release - SHARED'
    runs-on: ${{ matrix.runner.os }}
    strategy:
      matrix:
        runner:
          - { os: ubuntu-24.04,     arch: x64   }
          # - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo eatmydata apt-get -y install ninja-build python3-lxml

      - name: Install Conan & common config
        run: |
          python -m pip install conan==1.*
          conan profile new --detect default
          conan profile update settings.build_type=Release default
          conan profile update settings.compiler.libcxx=libstdc++11 default

      - name: Run Conan
        run: |
          mkdir build && cd build
          conan profile show default
          conan install .. -o webready=True --build missing

      - name: Build
        run: |
          cmake --preset linux-release -S . -B build
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  macOS:
    name: 'macOS - XCode - Arch:${{ matrix.runner.arch }} BuildType:Release - SHARED'
    runs-on: ${{ matrix.runner.os }}
    strategy:
      matrix:
        runner:
          # - { os: macos-15-intel, arch: x64   }
          - { os: macos-15,       arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew install inih googletest

      - name: Build
        run: |
          cmake --preset base_mac -S . -B build
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  Windows:
    name: 'Windows 11 - MSVC - Arch:${{ matrix.runner.arch }} BuildType:Release - SHARED'
    runs-on: ${{ matrix.runner.os }}
    strategy:
      matrix:
        runner:
          - { os: windows-2022, arch: x64   }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.runner.arch }}

      - name: Restore Conan cache
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/conanCache
          key: ${{runner.os}}-push-win-${{ hashFiles('conanfile.py') }}

      - name: Install Conan & common config
        run: |
          python -m pip install conan==1.* lxml
          conan profile new --detect default
          conan profile show default
          conan profile update settings.build_type=Release default
          conan profile update settings.compiler="Visual Studio" default
          conan profile update settings.compiler.version=17 default
          conan config set storage.path=$Env:GITHUB_WORKSPACE/conanCache

      - name: Run Conan
        run: |
          md build
          cd build
          conan install .. --build missing

      - name: Build
        run: |
          cmake --preset win-release -S . -B build
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
