# Basic CI for all platforms on push
# Note that we want to run this as fast as possible and just for the more common configurations. On
# PRs, we will test things more intensively :)
# - Only running UnitTests and not regression tests

on:
  push:
    paths-ignore:
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: On PUSH - Basic CI for main platforms

jobs:
  windows:
    name: 'Windows 10 - MSVC - Arch:X64 BuildType:Release - SHARED'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Conan cache
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/conanCache
          key: ${{runner.os}}-push-win-${{ hashFiles('conanfile.py') }}

      - name: Install Conan & Common config
        run: |
          python -m pip install 'conan>=2,<3' lxml
          conan profile detect --name default --force
          $profile = Join-Path $HOME '.conan2/profiles/default'
          $content = Get-Content $profile
          $content = $content -replace '^compiler=.*', 'compiler=msvc'
          $content = $content -replace '^compiler.version=.*', 'compiler.version=193'
          Set-Content -Path $profile -Value $content
          $globalConfig = Join-Path $HOME '.conan2/global.conf'
          if (-not (Test-Path $globalConfig)) { New-Item -ItemType File -Path $globalConfig -Force | Out-Null }
          $value = "core.cache:storage_path=$Env:GITHUB_WORKSPACE/conanCache"
          if (-not ((Get-Content $globalConfig -ErrorAction SilentlyContinue) -contains $value)) { Add-Content -Path $globalConfig -Value $value }

      - name: Build
        run: |
          cmake --preset win-release -S . -B build
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  Linux:
    name: 'Ubuntu 22.04 - GCC - Arch:X64 BuildType:Release - SHARED'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo eatmydata apt-get -y install ninja-build
          python3 -m pip install 'conan>=2,<3' lxml

      - name: Conan
        run: |
          mkdir build && cd build
          conan profile detect --name default --force
          sed -i 's/^compiler.libcxx=.*/compiler.libcxx=libstdc++11/' ~/.conan2/profiles/default
          conan install .. -o webready=True --build missing

      - name: Build
        run: |
          cmake --preset linux-release -S . -B build
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  MacOS:
    name: 'macOS - XCode - Arch:${{ matrix.runner.arch }} BuildType:Release - SHARED'
    runs-on: ${{ matrix.runner.os }}
    strategy:
      matrix:
        runner:
          - { os: macos-15-intel, arch: X64   }
          - { os: macos-latest,   arch: ARM64 }

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew install inih googletest

      - name: Build
        run: |
          cmake --preset base_mac -S . -B build
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
